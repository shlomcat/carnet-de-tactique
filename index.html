<style>
/* Layout: a training notebook — a slim control bar, then three tabs (Bilan, Exercices, Parties); the board is the hero of the Exercices tab. */
:root{
  --bg:#eef0f3; --surface:#ffffff; --ink:#161a21; --muted:#5b6472; --line:#d8dde5;
  --accent:#b86e00; --accent-ink:#ffffff; --accent-soft:#f6e7cf;
  --sq-l:#dfe4e8; --sq-d:#7d91a3; --sq-sel:#e8b04a; --sq-hint:rgba(22,26,33,.28);
  --good:#2b7a4b; --warn:#a86b00; --bad:#c0392b; --info:#3b6ea5;
  --good-soft:#dcefe3; --bad-soft:#f7dedb;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-piece:"Noto Sans Symbols 2","Segoe UI Symbol","DejaVu Sans",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141a; --surface:#191d25; --ink:#e6e9ef; --muted:#97a1b1; --line:#2a313c;
  --accent:#f0a830; --accent-ink:#1a1206; --accent-soft:#3a2c14;
  --sq-l:#c4ccd4; --sq-d:#5d7287; --sq-sel:#e0a63a; --sq-hint:rgba(10,12,16,.35);
  --good:#5cc489; --warn:#e3a33c; --bad:#ef7b6c; --info:#7fb0e6;
  --good-soft:#173324; --bad-soft:#3a1d1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141a; --surface:#191d25; --ink:#e6e9ef; --muted:#97a1b1; --line:#2a313c;
  --accent:#f0a830; --accent-ink:#1a1206; --accent-soft:#3a2c14;
  --sq-l:#c4ccd4; --sq-d:#5d7287; --sq-sel:#e0a63a; --sq-hint:rgba(10,12,16,.35);
  --good:#5cc489; --warn:#e3a33c; --bad:#ef7b6c; --info:#7fb0e6;
  --good-soft:#173324; --bad-soft:#3a1d1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:1.9rem;font-weight:800;font-stretch:72%;letter-spacing:.01em;line-height:1}
h2{font-size:1.25rem;font-weight:750;font-stretch:80%}
h3{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* masthead + controls */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.mast .who{display:grid;gap:6px}
.mast .who small{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
form.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.fld{display:grid;gap:3px}
.fld label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.fld input,.fld select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
.fld input{width:150px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.notice.err{border-color:var(--bad);background:var(--bad-soft)}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:650;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tabs .count{font-family:var(--f-mono);font-size:.75rem;margin-left:6px;color:var(--muted)}

/* bilan */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:grid;gap:2px}
.kpi b{font-family:var(--f-display);font-size:1.6rem;font-weight:800;font-stretch:75%;font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.panel p{margin:0;max-width:65ch}
.phase-row{display:grid;grid-template-columns:110px 1fr 52px;gap:10px;align-items:center;font-size:.9rem}
.stack{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--bg)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.c-g{--c:var(--bad)} .c-e{--c:var(--warn)} .c-i{--c:var(--info)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}
.wbar{display:inline-block;width:64px;height:6px;border-radius:3px;background:var(--line);vertical-align:middle;margin-left:8px;overflow:hidden}
.wbar i{display:block;height:100%;background:var(--ink)}
.chip{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:10px;font-family:var(--f-mono)}
.chip.W{background:var(--good-soft);color:var(--good)} .chip.L{background:var(--bad-soft);color:var(--bad)} .chip.D{background:var(--bg);color:var(--muted)}
.flag{color:var(--bad);font-weight:700;font-size:.75rem;margin-left:6px}
.spark{width:100%;height:120px;display:block}
.callouts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.callouts li{padding-left:14px;border-left:3px solid var(--accent);max-width:70ch}

/* exercices */
.ex{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:760px){.ex{grid-template-columns:1fr}}
.boardbox{position:relative;width:100%;max-width:440px;aspect-ratio:1}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;height:100%;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;border:0;padding:0;background:var(--sq-l)}
.sq.d{background:var(--sq-d)}
.sq.sel{background:var(--sq-sel)}
.sq.hint::after{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:var(--sq-hint)}
.sq.hint.cap::after{width:88%;height:88%;background:none;border:4px solid var(--sq-hint)}
.sq.good{box-shadow:inset 0 0 0 4px var(--good)} .sq.badm{box-shadow:inset 0 0 0 4px var(--bad)}
.pc{font-family:var(--f-piece);font-size:min(9vw,44px);line-height:1;pointer-events:none}
.pc.w{color:#fbfbf8;text-shadow:0 0 1px #000,0 0 1px #000,0 1px 1px rgba(0,0,0,.6)}
.pc.b{color:#14171c;text-shadow:0 0 1px rgba(255,255,255,.35)}
.coord{position:absolute;font-size:.6rem;font-family:var(--f-mono);opacity:.7;pointer-events:none;color:#14171c}
.coord.f{right:3px;bottom:1px} .coord.r{left:3px;top:1px}
svg.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.side{display:grid;gap:14px;min-width:0}
.prompt{font-family:var(--f-display);font-size:1.4rem;font-weight:750;font-stretch:80%}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--muted)}
.verdict{border-radius:8px;padding:12px 14px;display:grid;gap:6px}
.verdict.ok{background:var(--good-soft)} .verdict.ko{background:var(--bad-soft)}
.verdict b{font-family:var(--f-display);font-size:1.1rem}
.line{font-family:var(--f-mono);font-size:.88rem;word-break:break-word}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.explain{background:var(--bg);border-radius:8px;padding:12px 14px;white-space:pre-wrap;max-width:65ch}
.exfilters{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dots button{width:14px;height:14px;border-radius:3px;border:1px solid var(--line);background:var(--surface);padding:0;cursor:pointer}
.dots button.ok{background:var(--good);border-color:var(--good)}
.dots button.ko{background:var(--bad);border-color:var(--bad)}
.dots button.cur{outline:2px solid var(--accent);outline-offset:1px}
a{color:var(--info)}
.reading{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.reading ul{margin:0;padding-left:18px;display:grid;gap:4px}
.nat{display:inline-block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:10px;background:var(--bg)}
.nat.tactique{background:var(--bad-soft);color:var(--bad)} .nat.stratégique{background:var(--accent-soft);color:var(--accent)} .nat.concret{background:var(--bg);color:var(--muted)}
.themes{display:grid;gap:6px}
.themes button{display:grid;grid-template-columns:1fr auto;gap:10px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 0;cursor:pointer}
.themes button:hover span:first-child{text-decoration:underline}
.grow{cursor:pointer} .grow:hover td{background:var(--bg)} .grow.sel td{background:var(--accent-soft)}
.rev td{background:var(--surface)} .review{display:grid;gap:12px;padding:6px 0 10px}
.evchart{width:100%;height:150px;display:block}
.drift{border-left:3px solid var(--warn);padding:4px 0 4px 12px;display:grid;gap:4px}
.drift ul{margin:0;padding-left:18px;display:grid;gap:3px}
.split{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--bg)}
.split i{display:block;height:100%}
.srow{cursor:pointer} .srow:hover td:first-child{text-decoration:underline} .srow.sel td{background:var(--accent-soft)}
.plan{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.plan dl{margin:0;display:grid;gap:8px} .plan dt{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600} .plan dd{margin:0;max-width:68ch}
.stbox{border-left:3px solid var(--accent);padding:4px 0 4px 12px;display:grid;gap:4px;font-size:.9rem}
.natbar{display:flex;height:14px;border-radius:3px;overflow:hidden}
.natbar i{display:block;height:100%}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  if(!window.Strat||!f.rv||!f.pvu)return null;

  // insights
  const ins=[];

     <table><tbody>${Object.keys(n).map(k=>`<tr><td><span class="nat ${k}">${NAT[k]}</span></td><td class="num">${n[k]}</td><td class="num">${pct(n[k],tot)} %</td></tr>`).join("")}</tbody></table>

let SELST=null;
function structPanel(rows,base){
  if(!window.Struct)return "";
  const done=rows.filter(r=>r[7]!==null&&r[7]!==undefined);
  if(done.length<20)return "";
  const typed=done.filter(r=>r[7]);
  const grp={};typed.forEach(r=>{const k=r[7]+"|"+r[8];(grp[k]=grp[k]||{id:r[7],side:r[8],n:0,w:0,l:0});grp[k].n++;if(r[2]==="W")grp[k].w++;if(r[2]==="L")grp[k].l++});
  const list=Object.values(grp).filter(g=>g.n>=3&&Struct.BYID[g.id]).sort((a,b)=>b.n-a.n);
  const sb=pct(done.filter(r=>r[2]==="W").length,done.length);
  const strat={};S.games.forEach(g=>{if(!g.st)return;const k=g.st+"|"+g.ss;g.f.filter(f=>f.t==="g"||f.t==="e").forEach(f=>{const r=reading(f);if(r&&r.nature==="stratégique")strat[k]=(strat[k]||0)+1})});
  const role=g=>{const p=Struct.planFor(g.id,g.side);return p&&p.role?p.role:"—"};
  if(!SELST&&list.length){const weak=list.filter(g=>g.n>=8).sort((a,b)=>pct(a.w,a.n)-pct(b.w,b.n))[0];SELST=(weak||list[0]).id+"|"+(weak||list[0]).side}
  const sel=list.find(g=>g.id+"|"+g.side===SELST)||list[0];
  let detail="";
  if(sel){const pl=Struct.planFor(sel.id,sel.side);const nEx=S.games.filter(g=>g.st===sel.id).flatMap(g=>g.f).filter(f=>f.t==="g"||f.t==="e").length;
    detail=`<div class="plan"><h2>${esc(pl.name)}${pl.role?` <span class="muted" style="font-size:.9rem;font-weight:500">· toi ${esc(pl.role)}</span>`:""}</h2>
     <p>${esc(pl.desc)}</p>
     <dl><dt>Ton plan typique</dt><dd>${esc(pl.plan)}</dd><dt>Le piège à éviter</dt><dd>${esc(pl.trap)}</dd><dt>Ton bilan</dt><dd>${sel.n} parties, ${pct(sel.w,sel.n)} % de victoires (ta moyenne sur ces parties : ${sb} %).</dd></dl>
     ${nEx?`<div class="actions"><button class="btn" data-goex="${sel.id}">S'entraîner sur cette structure (${nEx} positions)</button></div>`:""}</div>`;}
  return `<div class="panel"><h3>Tes structures de pions · ${done.length} parties récentes, ${pct(typed.length,done.length)} % reconnues</h3>
   <div class="tscroll"><table><thead><tr><th>Structure</th><th>Ton camp</th><th class="num">Parties</th><th class="num">Victoires</th><th class="num">Fautes strat.</th></tr></thead><tbody>
   ${list.map(g=>{const w=pct(g.w,g.n),k=g.id+"|"+g.side;return `<tr class="srow ${sel&&k===sel.id+"|"+sel.side?"sel":""}" data-struct="${k}"><td>${esc(Struct.BYID[g.id].name)}${g.n>=8&&w<=sb-10?'<span class="flag">à travailler</span>':""}</td><td>${esc(role(g))}</td><td class="num">${g.n}</td><td class="num">${w} %<span class="wbar"><i style="width:${w}%"></i></span></td><td class="num">${strat[k]||"–"}</td></tr>`}).join("")}
   </tbody></table></div>
   <p class="muted" style="font-size:.8rem">Clique sur une ligne pour voir les plans typiques. « Fautes strat. » compte les erreurs stratégiques relevées dans tes parties analysées avec cette structure.</p>
   ${detail}</div>`;
}
function structHTML(g){
  if(!g||!g.st||!window.Struct)return "";
  const pl=Struct.planFor(g.st,g.ss);if(!pl)return "";
  return `<div class="stbox"><b>${esc(pl.name)}${pl.role?` · toi ${esc(pl.role)}`:""}</b><span>Plan typique : ${esc(pl.plan)}</span><span class="muted">Piège : ${esc(pl.trap)}</span></div>`;
}
function spark(v){
  if(v.length<2)return `<p class="muted">Pas assez de données.</p>`;
  const W=600,H=120,p=6,mn=Math.min(...v),mx=Math.max(...v),r=Math.max(1,mx-mn);
  const x=i=>p+i*(W-2*p)/(v.length-1),y=a=>H-18-(a-mn)*(H-30)/r;
  const d=v.map((a,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(a).toFixed(1)).join("");
  const last=v[v.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Évolution du classement de ${v[0]} à ${last}">
   <line x1="0" x2="${W}" y1="${y(mx)}" y2="${y(mx)}" style="stroke:var(--line)" stroke-dasharray="3 4"/>
   <line x1="0" x2="${W}" y1="${y(mn)}" y2="${y(mn)}" style="stroke:var(--line)" stroke-dasharray="3 4"/>
   <path d="${d} L${x(v.length-1)} ${H-18} L${x(0)} ${H-18}Z" style="fill:var(--accent-soft);stroke:none"/>
   <path d="${d}" style="fill:none;stroke:var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
  </svg>
  <div class="meta mono"><span>min ${mn}</span><span>max ${mx}</span><span>dernier ${last}</span></div>`;
}


/* ---------- dérives lentes ---------- */
let OPEN=null;
const DCACHE=new Map();
function drifts(g){
  if(!window.Drift||!g.mv||!g.ev)return [];
  if(DCACHE.has(g.id))return DCACHE.get(g.id);
  let r=[];try{r=Drift.find(g).map(d=>Object.assign({},d,Drift.describe(Chess,window.Strat,window.Struct,g,d)))}catch(e){console.error(e);r=[]}
  DCACHE.set(g.id,r);return r;
}
function driftExercise(g,d){
  // première position de la dérive où ton coup n'est pas celui du moteur
  const ply=d.own.find(p=>g.bm[p]&&g.bm[p].slice(0,4)!==g.mv[p].slice(0,4));if(ply==null)return null;
  const c=new Chess();for(let i=0;i<ply;i++){const u=g.mv[i];if(!c.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||"q"}))return null}
  const fen=c.fen(),bu=g.bm[ply],u=g.mv[ply];
  const t1=new Chess(fen),bm=t1.move({from:bu.slice(0,2),to:bu.slice(2,4),promotion:bu[4]||"q"});
  const t2=new Chess(fen),pm=t2.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||"q"});
  if(!bm||!pm)return null;
  let np=0;for(const r of c.board())for(const p of r)if(p&&"qrbn".includes(p.type))np++;
  return {n:Math.floor(ply/2)+1,fen,p:pm.san,pu:u,b:bm.san,bu,pv:[bm.san],l:d.cost,t:"d",ph:ply<20?"o":np<=6?"f":"m",ck:null,ev:g.ev[ply],drift:d,g,key:g.id+":d"+ply};
}
function driftHTML(d){
  return `<div class="drift"><b>Dérive lente · coups ${d.n0} à ${d.n1}</b><span>${esc(d.head)}</span><ul>${d.lines.map(l=>`<li>${esc(l)}</li>`).join("")}</ul><span class="muted mono" style="font-size:.8rem">Tes coups : ${esc(d.moves.join(" "))}</span></div>`;
}
function driftPanel(){
  if(!window.Drift)return "";
  const withCurve=S.games.filter(g=>g.ev&&g.mv);
  if(!withCurve.length)return `<div class="panel"><h3>Dérives lentes</h3><p class="muted">Relance une analyse pour détecter les dérives : les analyses plus anciennes ne contiennent pas la courbe d'évaluation.</p></div>`;
  const all=withCurve.flatMap(g=>drifts(g).map(d=>({g,d})));
  const lost=withCurve.filter(g=>g.res==="L"),lostD=lost.filter(g=>drifts(g).length);
  const fl=withCurve.flatMap(g=>g.f).filter(f=>f.t==="g"||f.t==="e").reduce((a,f)=>a+Math.min(500,f.l),0);
  const dl=all.reduce((a,x)=>a+x.d.cost,0),share=fl+dl?Math.round(100*dl/(fl+dl)):0;
  const tags={};all.forEach(x=>x.d.tags.forEach(t=>tags[t]=(tags[t]||0)+1));
  const top=Object.entries(tags).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const wingDiff=all.filter(x=>x.d.tags.includes("aile")).length;
  return `<div class="panel"><h3>Dérives lentes · ce que tu perds sans faire de faute</h3>
   ${all.length?`<p>${all.length} dérive${all.length>1?"s":""} dans ${new Set(all.map(x=>x.g.id)).size} de tes ${withCurve.length} parties analysées, dont ${lostD.length} de tes ${lost.length} défaites. Ces glissements représentent environ <b>${share} %</b> de l'évaluation que tu perds, le reste venant des gaffes et erreurs.</p>
   <div class="split" title="Dérives ${share} %, gaffes et erreurs ${100-share} %"><i style="width:${share}%;background:var(--warn)"></i><i style="width:${100-share}%;background:var(--bad)"></i></div>
   <div class="legend"><span style="--c:var(--warn)">Dérives lentes</span><span style="--c:var(--bad)">Gaffes et erreurs</span></div>
   <div class="grid2" style="gap:16px"><div><h3 style="margin-bottom:6px">Causes qui reviennent</h3><table><tbody>${top.map(([k,v])=>`<tr><td>${esc(Drift.TAGS[k]||k)}</td><td class="num">${v}</td></tr>`).join("")||`<tr><td class="muted">Aucune cause dominante.</td></tr>`}</tbody></table></div>
   <div style="display:grid;gap:8px;align-content:start"><p class="muted" style="font-size:.88rem">${wingDiff?`Dans ${wingDiff} dérive${wingDiff>1?"s":""} sur ${all.length}, tu jouais sur une autre aile que celle que visait le moteur : c'est un problème de plan, pas de calcul.`:"Pendant tes dérives, tu jouais généralement sur la même aile que le moteur : le problème est plutôt dans le choix précis des coups."}</p>
   <div class="actions"><button class="btn" data-godrift="1">S'entraîner sur le début de tes dérives</button></div></div></div>`:`<p class="muted">Aucune dérive nette dans les parties analysées : quand tu perds l'avantage, c'est par une faute identifiable.</p>`}
   <p class="muted" style="font-size:.78rem">Une dérive est une suite d'au moins 3 de tes coups, sans gaffe ni erreur, pendant laquelle l'évaluation baisse d'au moins 1,2 pion. Le détail par partie est dans l'onglet Parties.</p></div>`;
}
function reviewHTML(g){
  if(!g.ev||!g.mv)return `<p class="muted">Relance une analyse pour obtenir la courbe d'évaluation de cette partie.</p>`;
  const W=600,H=150,N=g.ev.length-1,cl=v=>Math.max(-500,Math.min(500,v)),x=i=>4+i*(W-8)/Math.max(1,N),y=v=>H/2-cl(v)*(H/2-10)/500;
  const ds=drifts(g);
  const pts=g.ev.map((v,i)=>x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ");
  const fp=f=>(f.n-1)*2+(g.c==="w"?0:1);
  const marks=g.f.filter(f=>f.t!=="i").map(f=>{const i=fp(f)+1;return `<circle cx="${x(i)}" cy="${y(g.ev[i]??0)}" r="4" style="fill:${f.t==="g"?"var(--bad)":"var(--warn)"};stroke:var(--surface)" stroke-width="1.5"><title>Coup ${f.n} : ${esc(f.p)} (${TY[f.t]})</title></circle>`}).join("");
  const zones=ds.map(d=>`<rect x="${x(d.from)}" y="0" width="${Math.max(2,x(d.to)-x(d.from))}" height="${H}" style="fill:var(--accent-soft)"><title>Dérive, coups ${d.n0} à ${d.n1}</title></rect>`).join("");
  return `<div class="review">
   <svg class="evchart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Évaluation de la partie, de ton point de vue">
    ${zones}
    <line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" style="stroke:var(--line)"/>
    <polyline points="${pts}" style="fill:none;stroke:var(--ink)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
    ${marks}
   </svg>
   <div class="legend"><span style="--c:var(--accent-soft)">Dérive lente</span><span class="c-g">Gaffe</span><span class="c-e">Erreur</span><span class="muted">Courbe de ton point de vue, bornée à ±5 pions</span></div>
   ${ds.length?ds.map(driftHTML).join(""):`<p class="muted" style="margin:0">Pas de dérive lente dans cette partie.</p>`}
  </div>`;
}

let EX=[],exI=0,exBoard=null,exSel=null,exDone=null,exFilter={ph:"all",st:"all",th:"all",sx:"all",ty:"all"};
function buildEx(){
  const all=S.games.flatMap(g=>g.f.filter(f=>(f.t==="g"||f.t==="e")&&(f.ev-f.l)<500).map(f=>({...f,g,key:g.id+":"+f.n+":"+f.pu})));

    if(this.wait&&this.wait.test(l)){const w=this.wait;this.wait=null;w.res(l)}
  }
  async init(){const p=this.until(l=>l==="uciok",this.spec.wait);this.send("uci");await p;const q=this.until(l=>l==="readyok",30000);this.send("isready");await q}

  async evalFen(fen,depth){{const g=new Chess(fen);if(g.in_checkmate())return {cp:-1500,pv:[]};if(g.in_stalemate()||g.insufficient_material())return {cp:0,pv:[]}}this.last=null;const p=this.until(l=>l.startsWith("bestmove"),60000);this.send("position fen "+fen);this.send(`go depth ${depth} movetime ${depth*250}`);const bm=await p;
    const b=bm.split(/\s+/)[1];let s=this.last||{k:"cp",v:0,pv:[]};
    if(b==="(none)"){const c=new Chess(fen);s=c.in_checkmate()?{k:"mate",v:0,pv:[]}:{k:"cp",v:0,pv:[]}}

async function startEngine(){

function fensFromPGN(pgn,maxPly){

function blockedNotice(user,err){
  setStatus(`<div><b>Impossible de joindre Chess.com pour le moment</b>${err&&err.message?" ("+esc(err.message)+")":""}. Vérifie ta connexion et réessaie, ou importe ici un export PGN de tes parties (Chess.com → Archives → sélectionner → Télécharger).</div>
   <div class="actions"><label class="btn" for="pgnFile">Importer un fichier PGN</label><input type="file" id="pgnFile" accept=".pgn,text/plain" hidden></div>`,null,true);
  $("#pgnFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;const txt=await f.text();
    const metas=splitPGN(txt).map(p=>metaFromPGN(p,user)).filter(Boolean);
    if(!metas.length){setStatus(`Aucune partie de <b>${esc(user)}</b> dans ce fichier. Vérifie le pseudo saisi en haut.`,null,true);return}
    metas.sort((a,b)=>a.t-b.t);
    await runAnalysis(user,metas,null,"Import PGN");
  };
}
let busy=false;
async function runAnalysis(user,allMetas,rows,srcLabel){
  const cad=$("#cad").value,n=+$("#nb").value,depth=+$("#q").value;
  const pick=allMetas.filter(m=>m.tc===cad).slice(-n);
  if(!pick.length){setStatus(`Aucune partie en ${cad} trouvée pour <b>${esc(user)}</b>. Essaie une autre cadence.`,null,true);busy=false;$("#go").disabled=false;return}
  try{
    // structures de pions : les 300 dernières parties de la cadence choisie (sans moteur)
    if(window.Struct){const cl=allMetas.filter(m=>m.tc===cad).slice(-300);
      for(let i=0;i<cl.length;i++){
        if(i%20===0){setStatus(`Reconnaissance des structures de pions : ${i} parties sur ${cl.length}`,i/cl.length);await new Promise(r=>setTimeout(r,0))}
        let st=null;try{st=Struct.ofGame(fensFromPGN(cl[i].pgn,50))}catch(e){}
        cl[i].st=st?st.id:"";cl[i].ss=st?Struct.sideOf(st,cl[i].c):null;
      }}
    rows=allMetas.map(m=>[m.t,m.c,m.res,m.how,m.r,m.tc,m.op,m.st===undefined?null:m.st,m.ss===undefined?null:m.ss]);
    if(!ENG)ENG=await startEngine();
    const out=[];const t0=Date.now();
    for(let k=0;k<pick.length;k++){
      const g=await analyseGame(pick[k],depth,(i,L)=>{const done=(k+i/L)/pick.length;const el=(Date.now()-t0)/1000,rem=done>0.02?Math.round(el/done-el):null;
        setStatus(`Analyse de la partie ${k+1} sur ${pick.length} · coup ${Math.floor(i/2)+1}${rem!=null?` · environ ${rem>90?Math.round(rem/60)+" min":rem+" s"} restantes`:""}`,done)});
      if(g)out.push(g);
    }
    S={user,at:Date.now()/1000,rows,games:out,depth:`${srcLabel} · ${ENG.name} dans le navigateur, profondeur ${depth}`};
    store.set("carnet:last",S);exI=0;
    setStatus("");renderAll();
  }catch(err){setStatus(esc(err.message||"L'analyse a échoué."),null,true);console.error(err)}
  busy=false;$("#go").disabled=false;
}
$("#ctl").onsubmit=async ev=>{
  ev.preventDefault();if(busy)return;busy=true;$("#go").disabled=true;
  const user=$("#u").value.trim();
  setStatus("Connexion à Chess.com…",null);
  let raw;
  try{raw=await fetchChesscom(user)}
  catch(err){busy=false;$("#go").disabled=false;
    if(err.status===404){setStatus(`Le pseudo <b>${esc(user)}</b> n'existe pas sur Chess.com.`,null,true);return}
    blockedNotice(user,err);return}
  const metas=raw.map(x=>metaFromJSON(x,user)).sort((a,b)=>a.t-b.t);
  await runAnalysis(user,metas,null,"Chess.com");
};
$("#cad").onchange=()=>renderBilan();
$("#p-bilan").addEventListener("click",e=>{
  const sr=e.target.closest("[data-struct]");if(sr){SELST=sr.dataset.struct;renderBilan();return}
  const gd=e.target.closest("[data-godrift]");if(gd){exFilter={ph:"all",st:"all",th:"all",sx:"all",ty:"d"};exI=0;renderEx();tab("ex");return}
  const sx=e.target.closest("[data-goex]");if(sx){exFilter={ph:"all",st:"all",th:"all",sx:sx.dataset.goex,ty:"all"};exI=0;renderEx();tab("ex");return}
  const b=e.target.closest("[data-theme]");if(!b)return;exFilter={ph:"all",st:"all",th:b.dataset.theme,sx:"all",ty:"f"};exI=0;renderEx();tab("ex")});

function renderAll(){
  DCACHE.clear();OPEN=null;
  $("#who").textContent=S.user;$("#u").value=S.user;
  $("#src").textContent=`v7 · ${S.games.length} parties analysées le ${new Date(S.at*1000).toLocaleDateString("fr-FR",{day:"numeric",month:"long"})} · ${S.depth||""}`;
  const counts={};S.rows.forEach(r=>counts[r[5]]=(counts[r[5]]||0)+1);
  const main=S.games[0]?.tc||Object.entries(counts).sort((a,b)=>b[1]-a[1])[0]?.[0]||"blitz";
  $("#cad").value=main;
  renderBilan();renderParties();renderEx();
}
renderAll();
/* écran étroit : réglages plus légers par défaut (le moteur est plus lent sur téléphone) */
if(matchMedia("(max-width:600px)").matches&&!store.get("carnet:last")){$("#nb").value="10";$("#q").value="10"}
tab(store.get("carnet:tab")||"bilan");
</script>
