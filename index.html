<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11141a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Carnet de tactique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+Symbols+2&display=swap">
</head>
<body>
<style>
/* Layout: a training notebook — a slim control bar, then three tabs (Bilan, Exercices, Parties); the board is the hero of the Exercices tab. */
:root{
  --bg:#eef0f3; --surface:#ffffff; --ink:#161a21; --muted:#5b6472; --line:#d8dde5;
  --accent:#b86e00; --accent-ink:#ffffff; --accent-soft:#f6e7cf;
  --sq-l:#dfe4e8; --sq-d:#7d91a3; --sq-sel:#e8b04a; --sq-hint:rgba(22,26,33,.28);
  --good:#2b7a4b; --warn:#a86b00; --bad:#c0392b; --info:#3b6ea5;
  --good-soft:#dcefe3; --bad-soft:#f7dedb;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-piece:"Noto Sans Symbols 2","Segoe UI Symbol","DejaVu Sans",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141a; --surface:#191d25; --ink:#e6e9ef; --muted:#97a1b1; --line:#2a313c;
  --accent:#f0a830; --accent-ink:#1a1206; --accent-soft:#3a2c14;
  --sq-l:#c4ccd4; --sq-d:#5d7287; --sq-sel:#e0a63a; --sq-hint:rgba(10,12,16,.35);
  --good:#5cc489; --warn:#e3a33c; --bad:#ef7b6c; --info:#7fb0e6;
  --good-soft:#173324; --bad-soft:#3a1d1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141a; --surface:#191d25; --ink:#e6e9ef; --muted:#97a1b1; --line:#2a313c;
  --accent:#f0a830; --accent-ink:#1a1206; --accent-soft:#3a2c14;
  --sq-l:#c4ccd4; --sq-d:#5d7287; --sq-sel:#e0a63a; --sq-hint:rgba(10,12,16,.35);
  --good:#5cc489; --warn:#e3a33c; --bad:#ef7b6c; --info:#7fb0e6;
  --good-soft:#173324; --bad-soft:#3a1d1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:1.9rem;font-weight:800;font-stretch:72%;letter-spacing:.01em;line-height:1}
h2{font-size:1.25rem;font-weight:750;font-stretch:80%}
h3{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* masthead + controls */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.mast .who{display:grid;gap:6px}
.mast .who small{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
form.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.fld{display:grid;gap:3px}
.fld label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.fld .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.chk{display:flex;align-items:center;gap:6px;min-height:36px;cursor:pointer;font-size:.88rem}
.chk input{width:auto;margin:0;accent-color:var(--accent)}
.fld input,.fld select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
.fld input:not([type=checkbox]){width:150px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.notice.err{border-color:var(--bad);background:var(--bad-soft)}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:650;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tabs .count{font-family:var(--f-mono);font-size:.75rem;margin-left:6px;color:var(--muted)}
@media (max-width:600px){.tabs{gap:0}.tabs button{padding:10px 8px;font-size:.88rem;white-space:nowrap;flex:1 0 auto}.tabs .count{margin-left:3px}}
@media (max-width:430px){.tabs .count{display:none}}

/* bilan */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:grid;gap:2px}
.kpi b{font-family:var(--f-display);font-size:1.6rem;font-weight:800;font-stretch:75%;font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.panel p{margin:0;max-width:65ch}
.phase-row{display:grid;grid-template-columns:110px 1fr 52px;gap:10px;align-items:center;font-size:.9rem}
.stack{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--bg)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.c-g{--c:var(--bad)} .c-e{--c:var(--warn)} .c-i{--c:var(--info)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}
.wbar{display:inline-block;width:64px;height:6px;border-radius:3px;background:var(--line);vertical-align:middle;margin-left:8px;overflow:hidden}
.wbar i{display:block;height:100%;background:var(--ink)}
.chip{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:10px;font-family:var(--f-mono)}
.chip.W{background:var(--good-soft);color:var(--good)} .chip.L{background:var(--bad-soft);color:var(--bad)} .chip.D{background:var(--bg);color:var(--muted)}
.flag{color:var(--bad);font-weight:700;font-size:.75rem;margin-left:6px}
.spark{width:100%;height:120px;display:block}
.callouts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.callouts li{padding-left:14px;border-left:3px solid var(--accent);max-width:70ch}

/* exercices */
.ex{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:760px){.ex{grid-template-columns:1fr}}
.boardbox{position:relative;width:100%;max-width:440px;aspect-ratio:1}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;height:100%;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;border:0;padding:0;background:var(--sq-l)}
.sq.d{background:var(--sq-d)}
.sq.sel{background:var(--sq-sel)}
.sq.hint::after{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:var(--sq-hint)}
.sq.hint.cap::after{width:88%;height:88%;background:none;border:4px solid var(--sq-hint)}
.sq.good{box-shadow:inset 0 0 0 4px var(--good)} .sq.badm{box-shadow:inset 0 0 0 4px var(--bad)}
.pc{font-family:var(--f-piece);font-size:min(9vw,44px);line-height:1;pointer-events:none}
.pc.w{color:#fbfbf8;text-shadow:0 0 1px #000,0 0 1px #000,0 1px 1px rgba(0,0,0,.6)}
.pc.b{color:#14171c;text-shadow:0 0 1px rgba(255,255,255,.35)}
.coord{position:absolute;font-size:.6rem;font-family:var(--f-mono);opacity:.7;pointer-events:none;color:#14171c}
.coord.f{right:3px;bottom:1px} .coord.r{left:3px;top:1px}
svg.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.side{display:grid;gap:14px;min-width:0}
.prompt{font-family:var(--f-display);font-size:1.4rem;font-weight:750;font-stretch:80%}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--muted)}
.verdict{border-radius:8px;padding:12px 14px;display:grid;gap:6px}
.verdict.ok{background:var(--good-soft)} .verdict.ko{background:var(--bad-soft)}
.verdict b{font-family:var(--f-display);font-size:1.1rem}
.line{font-family:var(--f-mono);font-size:.88rem;word-break:break-word}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.explain{background:var(--bg);border-radius:8px;padding:12px 14px;white-space:pre-wrap;max-width:65ch}
.exfilters{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dots button{width:14px;height:14px;border-radius:3px;border:1px solid var(--line);background:var(--surface);padding:0;cursor:pointer}
.dots button.ok{background:var(--good);border-color:var(--good)}
.dots button.ko{background:var(--bad);border-color:var(--bad)}
.dots button.cur{outline:2px solid var(--accent);outline-offset:1px}
a{color:var(--info)}
.reading{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.reading ul{margin:0;padding-left:18px;display:grid;gap:4px}
.nat{display:inline-block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:10px;background:var(--bg)}
.nat.tactique{background:var(--bad-soft);color:var(--bad)} .nat.stratégique{background:var(--accent-soft);color:var(--accent)} .nat.concret{background:var(--bg);color:var(--muted)}
.themes{display:grid;gap:6px}
.themes button{display:grid;grid-template-columns:1fr auto;gap:10px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 0;cursor:pointer}
.themes button:hover span:first-child{text-decoration:underline}
.grow{cursor:pointer} .grow:hover td{background:var(--bg)} .grow.sel td{background:var(--accent-soft)}
.rev td{background:var(--surface)} .review{display:grid;gap:12px;padding:6px 0 10px}
.evchart{width:100%;height:150px;display:block}
.drift{border-left:3px solid var(--warn);padding:4px 0 4px 12px;display:grid;gap:4px}
.drift ul{margin:0;padding-left:18px;display:grid;gap:3px}
.split{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--bg)}
.split i{display:block;height:100%}
.srow{cursor:pointer}
/* revue */
.rv{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.rv{grid-template-columns:1fr}}
.rvl{display:grid;gap:10px;min-width:0}
.rvnav{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rvnav .btn{min-width:46px}
.rvr{display:grid;gap:12px;min-width:0}
.moves{display:grid;grid-template-columns:34px 1fr 1fr;gap:2px 6px;max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);font-family:var(--f-mono);font-size:.88rem;position:relative}
.mn{color:var(--muted);padding:3px 0}
.mv{text-align:left;border:0;background:none;padding:3px 6px;border-radius:4px;cursor:pointer;font:inherit;color:inherit}
.mv:hover{background:var(--bg)} .mv.me{font-weight:600}
.mv.cur{background:var(--accent);color:var(--accent-ink)}
.mv b{margin-left:2px} .mv.a-g b{color:var(--bad)} .mv.a-e b{color:var(--warn)} .mv.a-i b{color:var(--info)} .mv.cur b{color:inherit}
.mv.drift-mv{box-shadow:inset 3px 0 0 var(--warn)}
.crit-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bad);margin-left:4px;vertical-align:middle}
.rcomment{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;align-content:start}
.rcomment p{margin:0;line-height:1.55}

/* barre d'évaluation (formule de Lichess : chances de gain à partir de l'évaluation) */
.bwrap{display:flex;align-items:stretch;width:100%;max-width:458px}
.bwrap .boardbox{flex:1;min-width:0;max-width:none}
.gauge{position:relative;width:18px;flex:none;background:#3b3e44;overflow:hidden;border-radius:0 4px 4px 0;box-shadow:0 0 0 1px var(--line)}
.gauge .gw{position:absolute;left:0;right:0;bottom:0;height:50%;background:#f4f4f2;transition:height .35s ease}
.gauge.flip .gw{bottom:auto;top:0}
.gauge .tk{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(12.5% - 1px),rgba(128,128,128,.45) calc(12.5% - 1px),rgba(128,128,128,.45) 12.5%)}
.gauge::after{content:"";position:absolute;left:0;right:0;top:calc(50% - 1px);height:2px;background:rgba(214,120,0,.7)}
.gauge .gl{position:absolute;left:0;right:0;text-align:center;font:600 9px/1 var(--f-mono);writing-mode:vertical-rl;transform:rotate(180deg);padding:4px 0;z-index:1}
@media (prefers-reduced-motion:reduce){.gauge .gw{transition:none}}
.rhint{font-size:.78rem;margin:0}
.lseq{white-space:normal}
.lm{font:inherit;font-family:var(--f-mono);font-size:.9em;border:0;background:var(--accent-soft);color:inherit;border-radius:4px;padding:0 4px;margin:1px 0;cursor:pointer}
.lm:hover,.lm:focus-visible{background:var(--accent);color:var(--accent-ink)}
.vline{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center;font-family:var(--f-mono);font-size:.88rem}
.vline .mn{padding:0 0 0 4px}
.rhead .btn{margin-left:auto;padding:4px 10px;font-size:.85rem}
.chat{display:grid;gap:8px}
.cands{display:grid;gap:6px}
.cands td{padding:4px 6px}
.cands tr.played td{background:var(--accent-soft)}
.cands .cl{font-size:.8rem;white-space:normal}
.ask{display:grid;gap:6px}
.ask textarea{font:inherit;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);color:var(--ink);resize:vertical;width:100%}
.ask-q{font-size:.9rem;padding:8px 12px;border-left:3px solid var(--line)}
.ask-q b{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

.rdeep{font-size:.8rem}
.rextra{display:grid;gap:10px}
.rv .rvl>*,.rv .rvr>*{min-width:0}
@media (max-width:760px){
  .rv .rvl,.rv .rvr{display:contents}
  .rv{display:flex;flex-direction:column;gap:10px}
  #rcomment{order:1;min-height:8.5em;max-height:34vh;overflow-y:auto}
  .rv .bwrap{order:2;align-self:center;width:100%}
  .rvnav{order:3}
  #rextra{order:4}
  #rchart{order:5}
  #rmoves{order:6;width:100%}

}
.rhead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.rchart{height:110px;cursor:pointer}
 .srow:hover td:first-child{text-decoration:underline} .srow.sel td{background:var(--accent-soft)}
.plan{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.plan dl{margin:0;display:grid;gap:8px} .plan dt{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600} .plan dd{margin:0;max-width:68ch}
.stbox{border-left:3px solid var(--accent);padding:4px 0 4px 12px;display:grid;gap:4px;font-size:.9rem}
.natbar{display:flex;height:14px;border-radius:3px;overflow:hidden}
.natbar i{display:block;height:100%}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style id="cg-css">
/* Échiquier : chessground (Lichess, GPL-3.0), pièces cburnett ; cases aux couleurs du carnet */
.cg-wrap {
  box-sizing: content-box;
  position: relative;
  display: block;
}

cg-container {
  position: absolute;
  width: 100%;
  height: 100%;
  display: block;
  top: 0;
}

cg-board {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  line-height: 0;
  background-size: cover;
}

.cg-wrap.manipulable cg-board {
  cursor: pointer;
}

cg-board square {
  position: absolute;
  top: 0;
  left: 0;
  width: 12.5%;
  height: 12.5%;
  pointer-events: none;
}

cg-board square.move-dest {
  pointer-events: auto;
}

cg-board square.last-move {
  will-change: transform;
}

.cg-wrap piece {
  position: absolute;
  top: 0;
  left: 0;
  width: 12.5%;
  height: 12.5%;
  background-size: cover;
  z-index: 2;
  will-change: transform;
  pointer-events: none;
}

cg-board piece.dragging {
  cursor: move;
  /* !important to override z-index from 3D piece inline style */
  z-index: 11 !important;
}

piece.anim {
  z-index: 8;
}

piece.fading {
  z-index: 1;
  opacity: 0.5;
}

.cg-wrap piece.ghost {
  opacity: 0.3;
}

.cg-wrap piece svg {
  overflow: hidden;
  position: relative;
  top: 0px;
  left: 0px;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 2;
  opacity: 0.6;
}

.cg-wrap cg-auto-pieces,
.cg-wrap .cg-shapes,
.cg-wrap .cg-custom-svgs {
  overflow: visible;
  position: absolute;
  top: 0px;
  left: 0px;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.cg-wrap cg-auto-pieces {
  z-index: 2;
}

.cg-wrap cg-auto-pieces piece {
  opacity: 0.3;
}

.cg-wrap .cg-shapes {
  overflow: hidden;
  opacity: 0.6;
  z-index: 2;
}

.cg-wrap .cg-custom-svgs {
  /* over piece.anim = 8, but under piece.dragging = 11 */
  z-index: 9;
}

.cg-wrap .cg-custom-svgs svg {
  overflow: visible;
}

.cg-wrap coords {
  position: absolute;
  display: flex;
  pointer-events: none;
  opacity: 0.8;
  font-family: sans-serif;
  font-size: 9px;
}

.cg-wrap coords.ranks {
  left: 4px;
  top: -20px;
  flex-flow: column-reverse;
  height: 100%;
  width: 12px;
}

.cg-wrap coords.ranks.black {
  flex-flow: column;
}

.cg-wrap coords.ranks.left {
  left: -15px;
  align-items: flex-end;
}

.cg-wrap coords.files {
  bottom: -4px;
  left: 24px;
  flex-flow: row;
  width: 100%;
  height: 16px;
  text-transform: uppercase;
  text-align: center;
}

.cg-wrap coords.files.black {
  flex-flow: row-reverse;
}

.cg-wrap coords coord {
  flex: 1 1 auto;
}

.cg-wrap coords.ranks coord {
  transform: translateY(39%);
}

.cg-wrap coords.squares {
  bottom: 0;
  left: 0;
  text-transform: uppercase;
  text-align: right;
  flex-flow: column-reverse;
  height: 100%;
  width: 12.5%;
}

.cg-wrap coords.squares.black {
  flex-flow: column;
}

.cg-wrap coords.squares.left {
  text-align: left;
}

.cg-wrap coords.squares coord {
  padding: 6% 4%;
}

.cg-wrap coords.squares.rank2 {
  transform: translateX(100%);
}

.cg-wrap coords.squares.rank3 {
  transform: translateX(200%);
}

.cg-wrap coords.squares.rank4 {
  transform: translateX(300%);
}

.cg-wrap coords.squares.rank5 {
  transform: translateX(400%);
}

.cg-wrap coords.squares.rank6 {
  transform: translateX(500%);
}

.cg-wrap coords.squares.rank7 {
  transform: translateX(600%);
}

.cg-wrap coords.squares.rank8 {
  transform: translateX(700%);
}

/** Colored board squares as an embedded SVG */
cg-board {
  background: conic-gradient(var(--sq-d) 0 25%, var(--sq-l) 0 50%, var(--sq-d) 0 75%, var(--sq-l) 0) 0 0 / 25% 25%;
}

/** Interactive board square colors */
cg-board square.move-dest {
  background: radial-gradient(rgba(20, 85, 30, 0.5) 22%, #208530 0, rgba(0, 0, 0, 0.3) 0, rgba(0, 0, 0, 0) 0);
}
cg-board square.premove-dest {
  background: radial-gradient(rgba(20, 30, 85, 0.5) 22%, #203085 0, rgba(0, 0, 0, 0.3) 0, rgba(0, 0, 0, 0) 0);
}
cg-board square.oc.move-dest {
  background: radial-gradient(transparent 0%, transparent 80%, rgba(20, 85, 0, 0.3) 80%);
}
cg-board square.oc.premove-dest {
  background: radial-gradient(transparent 0%, transparent 80%, rgba(20, 30, 85, 0.2) 80%);
}
cg-board square.move-dest:hover {
  background: rgba(20, 85, 30, 0.3);
}
cg-board square.premove-dest:hover {
  background: rgba(20, 30, 85, 0.2);
}
cg-board square.last-move {
  background-color: rgba(155, 199, 0, 0.41);
}
cg-board square.selected {
  background-color: rgba(20, 85, 30, 0.5);
}
cg-board square.check {
  background: radial-gradient(
    ellipse at center,
    rgba(255, 0, 0, 1) 0%,
    rgba(231, 0, 0, 1) 25%,
    rgba(169, 0, 0, 0) 89%,
    rgba(158, 0, 0, 0) 100%
  );
}
cg-board square.current-premove {
  background-color: rgba(20, 30, 85, 0.5);
}

/** Alternating colors in rank/file/square labels */
.orientation-white .ranks :nth-child(odd),
.orientation-white .files :nth-child(even),
.orientation-black .ranks :nth-child(even),
.orientation-black .files :nth-child(odd),
coords.squares:nth-of-type(odd) :nth-child(even),
coords.squares:nth-of-type(even) :nth-child(odd) {
  color: rgba(72, 72, 72, 0.8);
}

.orientation-white .ranks :nth-child(even),
.orientation-white .files :nth-child(odd),
.orientation-black .ranks :nth-child(odd),
.orientation-black .files :nth-child(even),
coords.squares:nth-of-type(odd) :nth-child(odd),
coords.squares:nth-of-type(even) :nth-child(even) {
  color: rgba(255, 255, 255, 0.8);
}

<script>
"use strict";
const $=s=>document.querySelector(s);
// mise à jour automatique : le navigateur garde la page en cache quelques minutes après une nouvelle version
const APPV=32;
fetch("version.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{if(d&&d.v>APPV){const u=new URL(location.href);if(u.searchParams.get("v")!==String(d.v)){u.searchParams.set("v",d.v);location.replace(u.href)}}}).catch(()=>{});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const SEED=JSON.parse(document.getElementById("seed").textContent);
const PH={o:"Ouverture",m:"Milieu de jeu",f:"Finale"}, TY={g:"Gaffe",e:"Erreur",i:"Imprécision"};
const HOW={resigned:"abandon",checkmated:"mat",timeout:"temps",abandoned:"partie abandonnée",timevsinsufficient:"temps (nulle)",agreed:"accord",repetition:"répétition",stalemate:"pat",insufficient:"matériel insuffisant","50move":"50 coups"};
let S=store.get("carnet:last")||SEED;
let EXS=store.get("carnet:ex")||{};

/* ---------- opening family from Chess.com ECO url ---------- */
function fam(eco){const e=(eco||"").split("/").pop();let f=e.split(/-\d|\.\.\.|-with|-Variation/)[0].replace(/-/g," ");return f.split(/\s+/).filter(Boolean).slice(0,3).join(" ")||"?"}

/* ---------- tabs ---------- */
const TABS=["bilan","ex","parties","revue","video"];
function tab(n){TABS.forEach(t=>{$("#t-"+t).setAttribute("aria-selected",t===n);$("#p-"+t).hidden=t!==n});store.set("carnet:tab",n);
  if(n==="revue"){if(!$("#p-revue").innerHTML)renderRevue();if(!RV.tried&&!RV.g)revLoadList()}
  if(n==="video"&&window.renderVideo&&!$("#p-video").innerHTML)renderVideo()}
TABS.forEach(t=>$("#t-"+t).onclick=()=>tab(t));


/* ---------- lecture stratégique ---------- */
const NAT={tactique:"Tactique",stratégique:"Stratégique",concret:"Concret"};
const NATDESC={tactique:"La sanction est matérielle ou un mat : c'est d'abord un calcul.",stratégique:"La position se dégrade sans perte de matériel immédiate : c'est une question de plan et de structure.",concret:"Pas d'explication positionnelle simple : initiative, coups forcés ou calcul à court terme."};
const READ=new Map();
function reading(f){
  if(!window.Strat||!f.rv||!f.pvu)return null;
  const k=f.fen+"|"+f.pu;if(READ.has(k))return READ.get(k);
  let r=null;try{r=Strat.compare(Chess,f)}catch(e){r=null}
  READ.set(k,r);return r;
}
function readingHTML(f){
  const r=reading(f);
  if(!r)return `<div class="reading muted" style="font-size:.85rem">Relance une analyse pour obtenir la lecture de la position sur cette faute.</div>`;
  return `<div class="reading"><div><h3 style="display:inline;margin-right:8px">Lecture de la position</h3><span class="nat ${r.nature}">${NAT[r.nature]}</span></div>
   <div class="muted" style="font-size:.85rem">${NATDESC[r.nature]}</div>
   ${r.findings.length?`<ul>${r.findings.map(x=>`<li>${esc(x.txt)}</li>`).join("")}</ul>`:""}
   <div class="muted" style="font-size:.76rem">Comparaison de la position quelques coups après ton coup et après le meilleur coup, selon les suites de Stockfish.</div></div>`;
}

/* ---------- rendering: bilan ---------- */
function pct(a,b){return b?Math.round(100*a/b):0}
function renderBilan(){
  const cad=$("#cad").value;
  const rows=S.rows.filter(r=>r[5]===cad);
  const G=S.games, F=G.flatMap(g=>g.f);
  const cnt=t=>F.filter(f=>f.t===t).length;
  const W=G.filter(g=>g.res==="W").length,L=G.filter(g=>g.res==="L").length;
  const gaf=F.filter(f=>f.t==="g"), gz=gaf.filter(f=>f.ck!=null&&f.ck<30).length;
  const cur=rows.length?rows[rows.length-1][4]:null;
  // phases
  const ph={o:{g:0,e:0,i:0},m:{g:0,e:0,i:0},f:{g:0,e:0,i:0}}; F.forEach(f=>ph[f.ph][f.t]++);
  const maxPh=Math.max(1,...Object.values(ph).map(p=>p.g+p.e+p.i));
  // openings
  const op={};rows.forEach(r=>{const k=r[6]+"|"+r[1];(op[k]=op[k]||{n:0,w:0,l:0,name:r[6],c:r[1]});op[k].n++;if(r[2]==="W")op[k].w++;if(r[2]==="L")op[k].l++});
  const ops=Object.values(op).filter(o=>o.n>=5).sort((a,b)=>b.n-a.n).slice(0,14);
  const allW=rows.filter(r=>r[2]==="W").length, base=pct(allW,rows.length);
  // losses
  const lost=rows.filter(r=>r[2]==="L"),how={};lost.forEach(r=>how[r[3]]=(how[r[3]]||0)+1);
  const wonT=rows.filter(r=>r[2]==="W"&&r[3]==="timeout").length;
  // tilt
  let aL=[0,0],aW=[0,0];for(let i=1;i<rows.length;i++){if(rows[i][0]-rows[i-1][0]>900)continue;const p=rows[i-1][2],w=rows[i][2]==="W";if(p==="L"){aL[0]++;aL[1]+=w}if(p==="W"){aW[0]++;aW[1]+=w}}
  // insights
  const ins=[];
  const phName=Object.entries(ph).sort((a,b)=>(b[1].g+b[1].e)-(a[1].g+a[1].e))[0];
  if(F.length) ins.push(`La plupart de tes gaffes et erreurs arrivent en <b>${PH[phName[0]].toLowerCase()}</b> (${phName[1].g+phName[1].e} sur ${cnt("g")+cnt("e")}).`);
  if(gaf.length) ins.push(gz/gaf.length<0.4?`Seules ${gz} gaffes sur ${gaf.length} sont faites sous 30 s : tes fautes viennent du calcul plus que de la pendule.`:`${gz} gaffes sur ${gaf.length} sont faites sous 30 s : la gestion du temps est un vrai levier.`);
  const weak=ops.filter(o=>o.n>=10&&pct(o.w,o.n)<=base-10).sort((a,b)=>pct(a.w,a.n)-pct(b.w,b.n))[0];
  if(weak) ins.push(`Point faible du répertoire : <b>${esc(weak.name)}</b> avec les ${weak.c==="w"?"blancs":"noirs"}, ${pct(weak.w,weak.n)} % de victoires sur ${weak.n} parties (ta moyenne : ${base} %).`);
  if(window.Struct){const sg={};rows.filter(r=>r[7]).forEach(r=>{const k=r[7]+"|"+r[8];(sg[k]=sg[k]||{id:r[7],side:r[8],n:0,w:0});sg[k].n++;if(r[2]==="W")sg[k].w++});
    const ws=Object.values(sg).filter(g=>g.n>=10&&pct(g.w,g.n)<=base-8).sort((a,b)=>pct(a.w,a.n)-pct(b.w,b.n))[0];
    if(ws){const pl=Struct.planFor(ws.id,ws.side);ins.push(`Structure la plus difficile pour toi : <b>${esc(pl.name)}</b>${pl.role?" ("+esc(pl.role)+")":""}, ${pct(ws.w,ws.n)} % de victoires sur ${ws.n} parties. Le plan typique est détaillé plus bas.`)}}
  const strong=ops.filter(o=>o.n>=10).sort((a,b)=>pct(b.w,b.n)-pct(a.w,a.n))[0];
  if(strong&&strong!==weak) ins.push(`Meilleure arme : <b>${esc(strong.name)}</b> avec les ${strong.c==="w"?"blancs":"noirs"} (${pct(strong.w,strong.n)} % sur ${strong.n} parties).`);
  if(aL[0]>20) ins.push(`Après une défaite, tu gagnes la suivante ${pct(aL[1],aL[0])} % du temps, contre ${pct(aW[1],aW[0])} % après une victoire${Math.abs(pct(aL[1],aL[0])-pct(aW[1],aW[0]))<5?" : pas de tilt visible":"."}.`);

  const rat=rows.map(r=>r[4]);
  $("#p-bilan").innerHTML=`
  <div style="display:grid;gap:20px">
    <div class="kpis">
      <div class="kpi"><b>${cur??"–"}</b><span>Classement ${cad} actuel</span></div>
      <div class="kpi"><b>${W}–${L}</b><span>Bilan des ${G.length} parties analysées</span></div>
      <div class="kpi"><b>${G.length?(F.length/G.length).toFixed(1):"–"}</b><span>Fautes par partie</span></div>
      <div class="kpi"><b>${cnt("g")}</b><span>Gaffes (≥ 3 pions perdus)</span></div>
      <div class="kpi"><b>${gaf.length?gz+"/"+gaf.length:"–"}</b><span>Gaffes sous 30 s</span></div>
    </div>
    ${ins.length?`<div class="panel"><h3>Ce qui ressort</h3><ul class="callouts">${ins.map(i=>`<li>${i}</li>`).join("")}</ul></div>`:""}
    <div class="grid2">
      <div class="panel"><h3>Où tu fais tes fautes</h3>
        ${["o","m","f"].map(k=>{const p=ph[k],n=p.g+p.e+p.i;return `<div class="phase-row"><span>${PH[k]}</span><div class="stack" title="${p.g} gaffes, ${p.e} erreurs, ${p.i} imprécisions">${["g","e","i"].map(t=>`<i class="c-${t}" style="width:${100*p[t]/maxPh}%;background:var(--c)"></i>`).join("")}</div><span class="mono" style="text-align:right">${p.g}/${p.e}/${p.i}</span></div>`}).join("")}
        <div class="legend"><span class="c-g">Gaffe</span><span class="c-e">Erreur (≥ 1,5 pion)</span><span class="c-i">Imprécision (≥ 0,8)</span></div>
      </div>
      <div class="panel"><h3>Classement ${cad} · ${rows.length} parties</h3>${spark(rat)}</div>
    </div>
    ${critPanel()}
    ${driftPanel()}
    ${structPanel(rows,base)}
    ${natPanel()}
    <div class="grid2">
      <div class="panel"><h3>Ouvertures · 5 parties ou plus</h3>
        <div class="tscroll"><table><thead><tr><th>Ouverture</th><th>Avec</th><th class="num">Parties</th><th class="num">Victoires</th></tr></thead><tbody>
        ${ops.map(o=>{const w=pct(o.w,o.n);return `<tr><td>${esc(o.name)}${o.n>=10&&w<=base-10?'<span class="flag">à travailler</span>':""}</td><td>${o.c==="w"?"Blancs":"Noirs"}</td><td class="num">${o.n}</td><td class="num">${w} %<span class="wbar"><i style="width:${w}%"></i></span></td></tr>`}).join("")||`<tr><td colspan="4" class="muted">Pas assez de parties dans cette cadence.</td></tr>`}
        </tbody></table></div>
        <p class="muted" style="font-size:.8rem">Ta moyenne en ${cad} : ${base} % de victoires sur ${rows.length} parties.</p>
      </div>
      <div class="panel"><h3>Comment se terminent tes défaites</h3>
        <table><tbody>${Object.entries(how).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(HOW[k]||k)}</td><td class="num">${v}</td><td class="num">${pct(v,lost.length)} %</td></tr>`).join("")}</tbody></table>
        <p class="muted" style="font-size:.85rem">Victoires au temps sur la même période : ${wonT}.</p>
      </div>
    </div>
  </div>`;
}

function natPanel(){
  const F=S.games.flatMap(g=>g.f).filter(f=>f.t==="g"||f.t==="e");
  const R=F.map(reading).filter(Boolean);
  if(!R.length)return "";
  const n={tactique:0,stratégique:0,concret:0},th={};
  R.forEach(r=>{n[r.nature]++;if(r.nature!=="tactique")r.findings.filter(x=>!["materiel","mat","gourmandise"].includes(x.k)).forEach(x=>th[x.k]=(th[x.k]||0)+1)});
  const tot=R.length,top=Object.entries(th).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const col={tactique:"var(--bad)",stratégique:"var(--accent)",concret:"var(--muted)"};
  return `<div class="grid2">
   <div class="panel"><h3>Nature de tes ${tot} gaffes et erreurs</h3>
     <div class="natbar">${Object.keys(n).map(k=>`<i style="width:${100*n[k]/tot}%;background:${col[k]}"></i>`).join("")}</div>
     <table><tbody>${Object.keys(n).map(k=>`<tr><td><span class="nat ${k}">${NAT[k]}</span></td><td class="num">${n[k]}</td><td class="num">${pct(n[k],tot)} %</td></tr>`).join("")}</tbody></table>
     <p class="muted" style="font-size:.82rem">${NATDESC.stratégique}</p>
   </div>
   <div class="panel"><h3>Thèmes qui reviennent dans tes fautes non tactiques</h3>
     <div class="themes">${top.map(([k,v])=>`<button data-theme="${k}"><span>${esc(Strat.THEMES[k]||k)}</span><span class="mono muted">${v}</span></button>`).join("")||`<span class="muted">Rien de récurrent.</span>`}</div>
     <p class="muted" style="font-size:.82rem">Clique sur un thème pour t'entraîner sur ces positions.</p>
   </div></div>`;
}

let SELST=null;
function structPanel(rows,base){

function spark(v){
  if(v.length<2)return `<p class="muted">Pas assez de données.</p>`;
  const W=600,H=120,p=6,mn=Math.min(...v),mx=Math.max(...v),r=Math.max(1,mx-mn);
  const x=i=>p+i*(W-2*p)/(v.length-1),y=a=>H-18-(a-mn)*(H-30)/r;

  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Évolution du classement de ${v[0]} à ${last}">

   <line x1="0" x2="${W}" y1="${y(mn)}" y2="${y(mn)}" style="stroke:var(--line)" stroke-dasharray="3 4"/>

}



/* ---------- moments critiques ---------- */
let CRCACHE=null,exAsk=false;
function crit(){
  if(!window.Crit)return null;
  if(CRCACHE)return CRCACHE;
  const G=S.games.filter(g=>g.gap&&g.ck);
  try{CRCACHE=G.length?Crit.analyze(Chess,window.Strat,G):{available:false}}catch(e){console.error(e);CRCACHE={available:false}}
  return CRCACHE;
}
function critExercises(){
  const r=crit();if(!r||!r.available)return [];
  // phase d'une position : ouverture, milieu de jeu ou finale (pièces hors pions et rois)
  const np=fen=>(fen.split(" ")[0].match(/[qrbnQRBN]/g)||[]).length;
  const phase=x=>x.ply<20?"o":np(x.fen)<=6?"f":"m";
  // on ne garde que des positions sorties d'ouverture (coup 12 et au-delà) pour que la phase ne trahisse rien
  const ok=x=>x.b&&x.ply>=22&&phase(x)!=="o";
  const crits=r.crit.filter(ok),pool=r.calm.filter(ok).filter(x=>!new Chess(x.fen).in_check());
  // chaque position critique reçoit une position calme de même phase et d'un numéro de coup proche
  const used=new Set(),pick=[];
  crits.forEach(c=>{let best=null,d=1e9;pool.forEach((x,k)=>{if(used.has(k)||phase(x)!==phase(c))return;const dd=Math.abs(x.ply-c.ply)+(x.g===c.g?0:1);if(dd<d){d=dd;best=k}});if(best!=null){used.add(best);pick.push(pool[best])}});
  const mk=(x,isCrit)=>({n:x.n,fen:x.fen,p:x.p,pu:x.pu,b:x.b,bu:x.bu,pv:[x.b],l:x.loss,t:"c",isCrit,kind:x.kind,gap:x.gap,sec:x.t,fault:x.fault,ph:phase(x),ck:x.clock,ev:x.ev,g:x.g,ply:x.ply,key:x.g.id+":c"+x.ply});
  const out=crits.map(x=>mk(x,true)).concat(pick.map(x=>mk(x,false)));
  // mélange stable, pour alterner critiques et calmes sans motif prévisible
  const h=k=>{let v=0;for(const ch of k)v=(v*31+ch.charCodeAt(0))>>>0;return v};
  out.sort((a,b)=>h(a.key)-h(b.key));
  return out;
}
function pawns(cp){const v=(Math.abs(cp)/100).toFixed(1).replace(".",",");return v+" pion"+(Math.abs(cp)>=200?"s":"")}
function critAnswer(guess){
  const e=EX[exI];if(!exAsk)return;exAsk=false;

  if(e.isCrit){
    if(!right){EXS[e.key]="ko";store.set("carnet:ex",EXS)}
    $("#fb").innerHTML=`<div class="verdict ${right?"ok":"ko"}">${intro}</div><p class="muted" style="margin:0">Trouve maintenant le coup : fais glisser la pièce, ou clique sur elle puis sur sa case d'arrivée.</p>`;enableMoves();
  }else{

    showSolution(e.bu,null);

    const d=document.querySelectorAll("#dots button")[exI];if(d&&EXS[e.key])d.classList.add(EXS[e.key]);
  }
}

/* ---------- dérives lentes ---------- */
let OPEN=null;
const DCACHE=new Map();
function drifts(g){
  if(!window.Drift||!g.mv||!g.ev)return [];
  if(DCACHE.has(g.id))return DCACHE.get(g.id);
  let r=[];try{r=Drift.find(g).map(d=>Object.assign({},d,Drift.describe(Chess,window.Strat,window.Struct,g,d)))}catch(e){console.error(e);r=[]}
  DCACHE.set(g.id,r);return r;
}
function driftExercise(g,d){
  // première position de la dérive où ton coup n'est pas celui du moteur
  const ply=d.own.find(p=>g.bm[p]&&g.bm[p].slice(0,4)!==g.mv[p].slice(0,4));if(ply==null)return null;
  const c=new Chess();for(let i=0;i<ply;i++){const u=g.mv[i];if(!c.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||"q"}))return null}
  const fen=c.fen(),bu=g.bm[ply],u=g.mv[ply];
  const t1=new Chess(fen),bm=t1.move({from:bu.slice(0,2),to:bu.slice(2,4),promotion:bu[4]||"q"});
  const t2=new Chess(fen),pm=t2.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||"q"});
  if(!bm||!pm)return null;
  let np=0;for(const r of c.board())for(const p of r)if(p&&"qrbn".includes(p.type))np++;
  return {n:Math.floor(ply/2)+1,fen,p:pm.san,pu:u,b:bm.san,bu,pv:[bm.san],l:d.cost,t:"d",ph:ply<20?"o":np<=6?"f":"m",ck:null,ev:g.ev[ply],drift:d,g,key:g.id+":d"+ply};
}
function driftHTML(d){
  return `<div class="drift"><b>Dérive lente · coups ${d.n0} à ${d.n1}</b><span>${esc(d.head)}</span><ul>${d.lines.map(l=>`<li>${esc(l)}</li>`).join("")}</ul><span class="muted mono" style="font-size:.8rem">Tes coups : ${esc(d.moves.join(" "))}</span></div>`;
}
function driftPanel(){
  if(!window.Drift)return "";
  const withCurve=S.games.filter(g=>g.ev&&g.mv);
  if(!withCurve.length)return `<div class="panel"><h3>Dérives lentes</h3><p class="muted">Relance une analyse pour détecter les dérives : les analyses plus anciennes ne contiennent pas la courbe d'évaluation.</p></div>`;
  const all=withCurve.flatMap(g=>drifts(g).map(d=>({g,d})));
  const lost=withCurve.filter(g=>g.res==="L"),lostD=lost.filter(g=>drifts(g).length);
  const fl=withCurve.flatMap(g=>g.f).filter(f=>f.t==="g"||f.t==="e").reduce((a,f)=>a+Math.min(500,f.l),0);
  const dl=all.reduce((a,x)=>a+x.d.cost,0),share=fl+dl?Math.round(100*dl/(fl+dl)):0;

   ${all.length?`<p>${all.length} dérive${all.length>1?"s":""} dans ${new Set(all.map(x=>x.g.id)).size} de tes ${withCurve.length} parties analysées, dont ${lostD.length} de tes ${lost.length} défaites. Ces glissements représentent environ <b>${share} %</b> de l'évaluation que tu perds, le reste venant des gaffes et erreurs.</p>
   <div class="split" title="Dérives ${share} %, gaffes et erreurs ${100-share} %"><i style="width:${share}%;background:var(--warn)"></i><i style="width:${100-share}%;background:var(--bad)"></i></div>
   <div class="legend"><span style="--c:var(--warn)">Dérives lentes</span><span style="--c:var(--bad)">Gaffes et erreurs</span></div>
   <div class="grid2" style="gap:16px"><div><h3 style="margin-bottom:6px">Causes qui reviennent</h3><table><tbody>${top.map(([k,v])=>`<tr><td>${esc(Drift.TAGS[k]||k)}</td><td class="num">${v}</td></tr>`).join("")||`<tr><td class="muted">Aucune cause dominante.</td></tr>`}</tbody></table></div>
   <div style="display:grid;gap:8px;align-content:start"><p class="muted" style="font-size:.88rem">${wingDiff?`Dans ${wingDiff} dérive${wingDiff>1?"s":""} sur ${all.length}, tu jouais sur une autre aile que celle que visait le moteur : c'est un problème de plan, pas de calcul.`:"Pendant tes dérives, tu jouais généralement sur la même aile que le moteur : le problème est plutôt dans le choix précis des coups."}</p>
   <div class="actions"><button class="btn" data-godrift="1">S'entraîner sur le début de tes dérives</button></div></div></div>`:`<p class="muted">Aucune dérive nette dans les parties analysées : quand tu perds l'avantage, c'est par une faute identifiable.</p>`}
   <p class="muted" style="font-size:.78rem">Une dérive est une suite d'au moins 3 de tes coups, sans gaffe ni erreur, pendant laquelle l'évaluation baisse d'au moins 1,2 pion. Le détail par partie est dans l'onglet Parties.</p></div>`;
}

// barre d'évaluation : part du blanc = 50 % + 50 % × chances de gain (formule de Lichess)
function setGauge(cpWhite){
  const el=$("#rgauge");if(!el)return;

  const pct=Math.max(2,Math.min(98,50+50*wc));

  const lab=el.querySelector(".gl"),flip=el.classList.contains("flip"),whiteAhead=cp>=0;
  lab.textContent=Math.abs(cp)>=1400?"M":(Math.abs(cp)/100).toFixed(1).replace(".",",");
  // le chiffre s'affiche du côté du camp qui mène, dans la couleur opposée pour rester lisible
  const atBottom=whiteAhead!==flip;lab.style.top=atBottom?"auto":"0";lab.style.bottom=atBottom?"0":"auto";lab.style.color=whiteAhead?"#3b3e44":"#f4f4f2";

}

/* ---------- variantes ---------- */
function varStart(fen0,ucis,k,hyp){
  const c=new Chess(fen0),fens=[fen0],sans=[],moves=[],ok=[];
  for(const u of ucis){const m=c.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||"q"});if(!m)break;ok.push(u);sans.push(m.san);moves.push(m);fens.push(c.fen())}
  RV.v={fen0,ucis:ok,sans,moves,fens,k:Math.min(k,fens.length-1),hyp:!!hyp};varShow();
}

  if(!RV.v){if(RV.g.mv[RV.ply]&&RV.g.mv[RV.ply].slice(0,4)===u.slice(0,4)){revGo(RV.ply+1);return}varStart(RV.fens[RV.ply],[u],1,false);return}
  const v=RV.v;if(v.ucis[v.k]&&v.ucis[v.k].slice(0,4)===u.slice(0,4)){v.k++;varShow();return}

}

  const fen=v.fens[v.k],m=v.k>0?v.moves[v.k-1]:null;
  revBoard(fen,m?[m.from,m.to]:null,[]);
  const start=new Chess(v.fen0),n0=+v.fen0.split(" ")[5],white0=start.turn()==="w";
  const chips=v.sans.map((s,j)=>{const ply=(white0?0:1)+j,num=n0+Math.floor(ply/2),w=ply%2===0;return `${w||j===0?`<span class="mn">${num}${w?".":"…"}</span>`:""}<button class="mv ${j+1===v.k?"cur":""}" data-vk="${j+1}">${esc(s)}</button>`}).join("");
  let desc="";
  if(m&&window.Explain){try{const ctx={ply:30};const d=Explain.describe(Chess,window.Strat,v.fens[v.k-1],v.ucis[v.k-1],ctx);desc=d.text?`<b class="mono">${esc(m.san)}</b> : ${esc(d.text)}.`:""}catch(e){}}
  $("#rcomment").innerHTML=`<div class="rhead"><b>Variante</b>${v.hyp?`<span class="muted">position hypothétique : le même camp rejoue, pour montrer la menace</span>`:""}<button class="btn" id="vExit">↩ Revenir à la partie</button></div>
   <div class="vline"><button class="mv ${v.k===0?"cur":""}" data-vk="0" title="Position de départ de la variante">début</button>${chips}</div>
   ${desc?`<p>${desc}</p>`:""}<p class="muted rdeep" id="veval">${ENG&&!busy?"Évaluation en cours…":busy?"Évaluation indisponible pendant une analyse de parties.":"Chargement du moteur…"}</p>`;
  varEval(fen);
}
async function varEval(fen){
  if(busy)return;const v=RV.v;
  try{
    if(!ENG)ENG=await startEngine();
    const r=await engineCall(fen,matchMedia("(max-width:600px)").matches?12:14,1);
    if(RV.v!==v||v.fens[v.k]!==fen)return;
    const ch=new Chess(fen),stm=ch.turn(),pov=stm===RV.g.c?r.cp:-r.cp;
    const el=$("#veval");if(!el)return;

    if(ch.in_stalemate()){el.innerHTML="Pat : partie nulle.";setGauge(0);return}
    const sug=[],c=new Chess(fen);for(const u of r.pv.slice(0,8)){const m=c.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||"q"});if(!m)break;sug.push({u,san:m.san})}
    v.sug=sug.map(x=>x.u);setGauge(stm==="w"?r.cp:-r.cp);
    el.classList.remove("muted");
    el.innerHTML=`Évaluation (de ton point de vue) : <b class="mono">${evfmt(pov)}</b>${sug.length?` · suite du moteur : <span class="lseq">${sug.map((x,j)=>`<button class="lm" data-sug="${j}">${esc(x.san)}</button>`).join(" ")}</span>`:""}`;
    if(sug[0])RV.cg.setAutoShapes([{orig:sug[0].u.slice(0,2),dest:sug[0].u.slice(2,4),brush:"blue"}]);
  }catch(e){const el=$("#veval");if(el)el.textContent="Évaluation indisponible : "+(e.message||e)}

/* analyse approfondie d'un coup, avec le moteur du navigateur, à la demande */
let ELOCK=Promise.resolve();
function engineCall(fen,depth,mp){
  const job=ELOCK.then(async()=>{if(busy)throw new Error("une analyse de parties est en cours");ENG.send(`setoption name MultiPV value ${mp}`);return ENG.evalFen(fen,depth)});
  ELOCK=job.catch(()=>{});return job;
}
async function revDeep(p,prefetch){
  const g=RV.g;if(!g||!window.Explain||busy)return;
  RV.deepCache=RV.deepCache||new Map();
  const i=p-1,key=g.id+":"+i;if(RV.deepCache.has(key)||RV.deepRun&&RV.deepRun.has(key))return;
  (RV.deepRun=RV.deepRun||new Set()).add(key);
  try{
    if(!ENG){const el=$("#rdeep");if(el)el.textContent="Chargement du moteur pour l'analyse approfondie…";ENG=await startEngine();setStatus("")}
    if(!prefetch&&RV.ply!==p){RV.deepRun.delete(key);return}
    const mine=(i%2===0)===(g.c==="w"),f=mine?revFault(i):null,rd=f&&f.rv?reading(f):null;
    const depth=matchMedia("(max-width:600px)").matches?11:13;
    const r=await Explain.deepComment(Chess,window.Strat,engineCall,g,i,RV.fens,{depth,lastCapSq:i>0&&RV.moves[i-1]&&RV.moves[i-1].captured?RV.moves[i-1].to:null,reading:rd});
    RV.deepCache.set(key,r);
    if(RV.g===g&&RV.ply===p&&!RV.v){const t=$("#rtext");if(t){t.innerHTML=linesHTML(r.text,r.lines);RV.curLines=r.lines}const d=$("#rdeep");if(d)d.remove();RV.tact=!!r.tact;$("#rextra").innerHTML=revExtra(p)}
    // on prépare le coup suivant pendant que tu lis celui-ci
    if(!prefetch&&RV.g===g&&p+1<RV.fens.length)setTimeout(()=>revDeep(p+1,true),50);
  }catch(e){console.error(e);const d=$("#rdeep");if(d)d.textContent="Analyse approfondie indisponible : "+(e.message||e)}
  RV.deepRun.delete(key);
}

function revFault(i){const g=RV.g;return g.f.find(f=>(f.n-1)*2+(g.c==="w"?0:1)===i)||null}
function revExtra(p){
  const g=RV.g;if(p===0)return "";
  const i=p-1,mine=(i%2===0)===(g.c==="w");let h="";
  const f=mine?revFault(i):null;
  if(f&&f.t!=="i"&&!RV.tact)h+=readingHTML(f);
  const cr=RV.crit[i];
  if(cr)h+=`<div class="stbox"><b>Moment critique</b><span>Un seul coup tenait : le deuxième meilleur perdait ${pawns(cr.gap)} (${esc(Crit.KIND[cr.kind].toLowerCase())}). ${cr.fault?"Tu t'es trompé":"Tu as trouvé"} en ${Math.round(cr.t)} s.</span></div>`;
  const d=RV.dr.find(d=>d.own.includes(i));
  if(d)h+=i===d.own[0]?driftHTML(d):`<div class="muted" style="font-size:.85rem">Pendant la dérive lente des coups ${d.n0} à ${d.n1} (détail au coup ${d.n0}).</div>`;
  if(RV.best&&g.bm[p]){const c=new Chess(RV.fens[p]),m=c.move({from:g.bm[p].slice(0,2),to:g.bm[p].slice(2,4),promotion:g.bm[p][4]||"q"});if(m)h+=`<div class="muted" style="font-size:.85rem">Meilleur coup dans cette position (flèche bleue) : <b class="mono">${esc(m.san)}</b></div>`}
  if(p===RV.fens.length-1)h+=`<div class="muted" style="font-size:.85rem">Fin de la partie : ${esc(HOW[g.how]||g.how||"")}.</div>`;
  const fc=RV.facts&&RV.facts.get(g.id+":"+i);
  h+=`<div id="rcands">${fc?candHTML(fc):`<div class="actions"><button class="btn" onclick="showCands(${p})">Voir les coups candidats</button></div>`}</div>`;
  if(window.videoSimilarHTML){try{h+=videoSimilarHTML(RV.fens[i])}catch(e){console.error(e)}}
  if(SAMPLE)h+=`<div id="rclaude">${chatHTML(g.id+":"+i,p)}</div>`;
  return h;
}


/* ---------- faits et outils pour Claude ---------- */
const PIECE_FR={p:"pion",n:"cavalier",b:"fou",r:"tour",q:"dame",k:"roi"};
function sanLine(fen,ucis,n){const c=new Chess(fen),out=[];for(const u of (ucis||[]).slice(0,n||99)){const m=c.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||"q"});if(!m)break;out.push(m.san)}return out}
function material(fen){const pl=fen.split(" ")[0],cnt={w:{},b:{}};for(const ch of pl){if(!/[a-z]/i.test(ch)||ch==="/")continue;const c=ch===ch.toUpperCase()?"w":"b",t=ch.toLowerCase();if(t==="k")continue;cnt[c][t]=(cnt[c][t]||0)+1}
  const txt=c=>["q","r","b","n","p"].filter(t=>cnt[c][t]).map(t=>cnt[c][t]+" "+PIECE_FR[t]+(cnt[c][t]>1?"s":"")).join(", ")||"rien";
  return `blancs : ${txt("w")} ; noirs : ${txt("b")}`}
// position de départ d'une demande : avant le coup commenté, ou celle affichée sur l'échiquier (variante)
function factsFen(depuis){if(depuis==="affichee"){return RV.v?RV.v.fens[RV.v.k]:RV.fens[RV.ply]}return RV.fens[RV.ply-1]||RV.fens[0]}
const povFmt=(fen,cp)=>evfmt(fen.split(" ")[1]===RV.g.c?cp:-cp);
async function candidates(fen,n,depth){
  const r=await engineCall(fen,depth,n);
  const ls=(r.lines&&r.lines.length?r.lines:[{cp:r.cp,pv:r.pv}]).slice(0,n);
  return ls.map(l=>({uci:l.pv[0],ucis:l.pv.slice(0,8),san:sanLine(fen,l.pv,1)[0],line:sanLine(fen,l.pv,7),cp:l.cp,ev:povFmt(fen,l.cp)})).filter(x=>x.san);
}
async function buildFacts(p){
  const g=RV.g,i=p-1,fen0=RV.fens[i],fen1=RV.fens[p],u=g.mv[i],mover=i%2===0?"w":"b";
  const key=g.id+":"+i;RV.facts=RV.facts||new Map();if(RV.facts.has(key))return RV.facts.get(key);
  if(!ENG)ENG=await startEngine();
  const depth=matchMedia("(max-width:600px)").matches?12:14;
  const cands=await candidates(fen0,4,depth);
  let played=cands.find(c=>c.uci&&c.uci.slice(0,4)===u.slice(0,4));
  if(!played){const B=await engineCall(fen1,depth,1);played={uci:u,san:RV.sans[i],cp:-B.cp,ev:povFmt(fen0,-B.cp),line:[RV.sans[i]].concat(sanLine(fen1,B.pv,6)),ucis:[u].concat(B.pv.slice(0,7))}}
  // la menace adverse avant le coup (ce que l'adversaire jouerait s'il avait le trait)
  let threat=null;const fn=Explain.nullMove?Explain.nullMove(Chess,fen0):null;
  if(fn){const T=await engineCall(fn,depth,1);const gain=T.cp-(-cands[0].cp);if(T.pv[0]&&gain>=100)threat={line:sanLine(fn,T.pv,5),gain}}
  let reading=null;try{reading=Strat.compare(Chess,{fen:fen0,pu:u,rv:sanLineUci(fen1,played.ucis.slice(1)),pvu:cands[0].ucis,bu:cands[0].uci,l:cands[0].cp-played.cp,ph:i<20?"o":"m",p:RV.sans[i]})}catch(e){}
  const f={fen0,fen1,mover,cands,played,threat,reading,depth,mat:material(fen0)};
  RV.facts.set(key,f);return f;
}
function sanLineUci(fen,ucis){return ucis||[]}
function factsText(f){
  const g=RV.g,who=f.mover===g.c?"le joueur entraîné":"son adversaire";
  return [`Trait aux ${f.mover==="w"?"blancs":"noirs"} (${who}). Matériel : ${f.mat}.`,
   `Coups candidats selon Stockfish (profondeur ${f.depth}), évaluations du point de vue du joueur entraîné :`,
   ...f.cands.map((c,k)=>`  ${k+1}. ${c.san} (${c.ev}) — suite : ${c.line.join(" ")}`),
   `Coup joué : ${f.played.san} (${f.played.ev}) — suite : ${f.played.line.join(" ")}`,
   f.threat?`Menace adverse avant le coup : ${f.threat.line.join(" ")} (gain d'environ ${(f.threat.gain/100).toFixed(1)} pion pour le camp qui menace).`:"Pas de menace adverse immédiate notable avant le coup.",
   f.reading&&f.reading.findings.length?`Différences de position entre le coup joué et le meilleur coup (quelques coups plus tard) : ${f.reading.findings.map(x=>x.txt).join(" ")}`:""].filter(Boolean).join("\n");
}
function candHTML(f){
  if(!f)return "";
  RV.candLines=f.cands.concat(f.cands.some(c=>c.uci&&c.uci.slice(0,4)===f.played.uci.slice(0,4))?[]:[f.played]);
  return `<div class="cands"><h3>Coups candidats · Stockfish, profondeur ${f.depth}</h3><table><tbody>${RV.candLines.map((c,k)=>`<tr${c.uci&&c.uci.slice(0,4)===f.played.uci.slice(0,4)?' class="played"':""}><td class="mono"><button class="lm" data-cand="${k}">${esc(c.san)}</button></td><td class="num mono">${esc(c.ev)}</td><td class="muted mono cl">${esc(c.line.slice(1,6).join(" "))}</td></tr>`).join("")}</tbody></table>
   <p class="muted" style="font-size:.76rem;margin:0">Évaluations de ton point de vue. La ligne surlignée est le coup joué. Clique sur un coup pour voir la variante.</p></div>`;
}
// outils proposés à Claude : il vérifie lui-même les variantes au lieu de les deviner
function claudeTools(log){
  const depuisSchema={type:"string",enum:["avant_le_coup","affichee"],description:"avant_le_coup (défaut) : la position juste avant le coup commenté ; affichee : la position actuellement sur l'échiquier (variante explorée par le joueur)."};
  return [
   {name:"meilleurs_coups",description:"Renvoie les 4 meilleurs coups selon Stockfish dans une position, avec l'évaluation (du point de vue du joueur entraîné, en pions) et la suite principale de chacun. À utiliser avant d'affirmer quel coup est le meilleur.",
    inputSchema:{type:"object",properties:{depuis:depuisSchema}},
    execute:async(inp)=>{const fen=factsFen(String(inp&&inp.depuis||"avant_le_coup"));log("cherche les meilleurs coups");const cs=await candidates(fen,4,13);return {fen,coups:cs.map(c=>({coup:c.san,evaluation:c.ev,suite:c.line.join(" ")}))}}},
   {name:"evaluer_ligne",description:"Joue une suite de coups en notation algébrique anglaise (ex. [\"Qxb7\", \"Rb8\"]) depuis une position, puis renvoie l'évaluation Stockfish de la position obtenue (du point de vue du joueur entraîné) et la meilleure continuation. Lève une erreur si un coup est illégal. À utiliser pour vérifier toute variante que tu veux citer.",
    inputSchema:{type:"object",properties:{coups:{type:"array",items:{type:"string"},description:"Coups en notation SAN anglaise : K, Q, R, B, N."},depuis:depuisSchema},required:["coups"]},
    execute:async(inp)=>{const fen=factsFen(String(inp&&inp.depuis||"avant_le_coup"));let moves=inp&&inp.coups;if(typeof moves==="string")moves=moves.split(/\s+/);moves=(moves||[]).map(String).filter(Boolean).slice(0,12);
      const c=new Chess(fen);for(const m of moves){if(!c.move(m.replace(/^(\d+\.+)/,""),{sloppy:true}))throw new Error(`coup illégal ou introuvable : ${m} (position ${c.fen()})`)}
      log("vérifie "+moves.join(" "));const end=c.fen();
      if(c.in_checkmate())return {coups:moves.join(" "),resultat:"échec et mat"};
      if(c.in_stalemate())return {coups:moves.join(" "),resultat:"pat (nulle)"};
      const r=await engineCall(end,13,1);return {coups:moves.join(" "),evaluation:povFmt(end,r.cp),suite_du_moteur:sanLine(end,r.pv,6).join(" "),fen:end}}}
  ];
}
async function showCands(p){
  const el=$("#rcands");if(!el)return;el.innerHTML=`<p class="muted rdeep">${busy?"Indisponible pendant une analyse de parties.":"Analyse des coups candidats…"}</p>`;

}

RV.chat=new Map();
function chatHTML(key,p){
  const c=RV.chat.get(key);
  if(!c)return `<div class="actions"><button class="btn" onclick="revClaude(${p})">Approfondir avec Claude</button></div>`;
  const turns=c.msgs.slice(1).map(m=>m.role==="assistant"?`<div class="explain">${esc(m.content)}</div>`:`<div class="ask-q"><b>Ta question</b> ${esc(m.shown||m.content)}</div>`).join("");
  return `<div class="chat"><h3>Avec Claude</h3>${turns}${c.pending?`<div class="explain" id="cpend">${c.partial?esc(c.partial):"Claude réfléchit…"}</div>`:""}
   ${c.pending?"":`<form class="ask" onsubmit="event.preventDefault();revAsk(${p})"><label for="rask" class="muted" style="font-size:.8rem">Une question sur ce coup ou sur la variante affichée ?</label><textarea id="rask" rows="2" placeholder="Par exemple : pourquoi pas Dxb7 ? que se passe-t-il si le fou recule ?"></textarea><div class="actions"><button class="btn primary" type="submit">Envoyer</button></div></form>`}
   ${c.err?`<p class="muted">${esc(c.err)}</p>`:""}</div>`;

function chatRender(key,p){const el=$("#rclaude");if(el&&RV.g&&RV.g.id+":"+(RV.ply-1)===key)el.innerHTML=chatHTML(key,p)}
async function chatSend(key,p){
  const c=RV.chat.get(key);c.pending=true;c.partial="";c.err=null;chatRender(key,p);
  try{
    let tools=null;try{const lim=SAMPLE.limits?await SAMPLE.limits():null;if(lim&&lim.tools&&ENG&&!busy)tools=claudeTools(t=>{c.partial=(c.partial?c.partial+"\n":"")+"(Claude "+t+" avec Stockfish…)";const el=$("#cpend");if(el)el.textContent=c.partial})}catch(e){}
    const opt={cache:false,onText:({text})=>{c.partial=text;const el=$("#cpend");if(el)el.textContent=text}};if(tools)opt.tools=tools;
    const r=await SAMPLE(c.msgs.map(m=>({role:m.role,content:m.content})),opt);
    c.msgs.push({role:"assistant",content:r.text});
  }catch(err){c.err=err&&err.code==="not_granted"?"Claude n'est pas autorisé pour cette page.":"Réponse indisponible ("+(err&&err.message||"erreur")+")."}
  c.pending=false;chatRender(key,p);
}
async function revClaude(p){
  const g=RV.g,i=p-1;if(!SAMPLE)return;
  const key=g.id+":"+i,dc=RV.deepCache&&RV.deepCache.get(key);
  RV.chat.set(key,{msgs:[],pending:true,partial:"Analyse des coups candidats avec Stockfish…"});chatRender(key,p);
  let facts=null;try{facts=await buildFacts(p);const el=$("#rcands");if(el&&RV.ply===p)el.innerHTML=candHTML(facts)}catch(e){console.error(e)}
  const mover=i%2===0?"blancs":"noirs",mine=(i%2===0)===(g.c==="w");
  const pl=g.st&&window.Struct?Struct.planFor(g.st,g.ss):null;
  const prompt=`Tu es un entraîneur d'échecs. Commente en français, en un paragraphe de 4 à 7 phrases, le coup ${RV.sans[i]} joué par les ${mover} (${mine?"le joueur que tu entraînes, environ "+(g.r||2000)+" Elo":"son adversaire"}).
Position avant le coup (FEN) : ${RV.fens[i]}
Coups précédents : ${RV.sans.slice(Math.max(0,i-8),i).join(" ")}
Évaluation du point de vue du joueur entraîné : avant ${evfmt(g.ev[i])}, après ${evfmt(g.ev[p])}.
${pl?`Structure de pions : ${pl.name}. Plan typique du joueur : ${pl.plan}\n`:""}Analyse calculée par Stockfish (elle fait foi, ne la contredis pas) : ${dc?Explain.plain(dc):"(analyse approfondie non disponible)"}
${facts?"Données Stockfish sur la position :\n"+factsText(facts)+"\n":""}${window.videoContext?videoContext(RV.fens[i]):""}Tu disposes peut-être d'outils pour interroger Stockfish (meilleurs_coups, evaluer_ligne) : utilise-les pour vérifier toute variante que tu veux citer et qui ne figure pas ci-dessus, plutôt que de la deviner.
Explique l'idée du coup, ce qu'il menace ou empêche, pourquoi la meilleure suite est meilleure s'il y a lieu, et la leçon générale à retenir. N'invente aucune variante qui ne figure pas ci-dessus. Pas de titre ni de liste. Le joueur pourra ensuite te poser des questions : réponds-y de façon concrète et brève, en t'appuyant sur les positions et évaluations qu'il te donnera.`;
  RV.chat.set(key,{msgs:[{role:"user",content:prompt}]});
  await chatSend(key,p);
}
async function revAsk(p){

  if(!c||!q||!q.trim()||c.pending)return;

    const v=RV.v,fen=v.fens[v.k];
    let ev="";try{if(ENG&&!busy){const r=await engineCall(fen,13,1);const stm=fen.split(" ")[1];ev=` Évaluation Stockfish de cette position (pour le joueur entraîné) : ${evfmt(stm===g.c?r.cp:-r.cp)}.`}}catch(e){}
    ctx=`\n[Position affichée sur l'échiquier : variante ${v.sans.slice(0,v.k).join(" ")||"(aucun coup)"} à partir de la position ${v.fen0}${v.hyp?" (position hypothétique où le même camp rejoue)":""}. FEN actuelle : ${fen}.${ev}]`;
  }

}
document.addEventListener("keydown",e=>{
  if($("#p-revue").hidden||!RV.g||/input|select|textarea/i.test(document.activeElement&&document.activeElement.tagName))return;
  if(e.key==="ArrowRight"){revStep(1);e.preventDefault()}else if(e.key==="ArrowLeft"){revStep(-1);e.preventDefault()}

  else if(e.key==="Escape"&&RV.v){revGo(RV.ply);e.preventDefault()}
});

/* ---------- échiquier (chessground) ---------- */
let CG=null;
function dests(fen){const c=new Chess(fen),d=new Map();c.moves({verbose:true}).forEach(m=>{if(!d.has(m.from))d.set(m.from,[]);d.get(m.from).push(m.to)});return d}
function sideOf(fen){return fen.split(" ")[1]==="w"?"white":"black"}
function mountBoard(e){
  const side=sideOf(e.fen),inCheck=new Chess(e.fen).in_check();
  CG=Chessground($("#board"),{fen:e.fen,orientation:side,turnColor:side,check:inCheck?side:false,coordinates:true,
    animation:{enabled:true,duration:160},highlight:{lastMove:true,check:true},premovable:{enabled:false},
    draggable:{enabled:true,showGhost:true},drawable:{enabled:true,visible:true},
    movable:{free:false,color:exAsk?undefined:side,showDests:true,dests:dests(e.fen),
      events:{after:(o,d)=>{const p=new Chess(e.fen).get(o);finish(o+d+(p&&p.type==="p"&&(d[1]==="8"||d[1]==="1")?"q":""))}}}});
}
function enableMoves(){const e=EX[exI];if(CG)CG.set({movable:{color:sideOf(e.fen),dests:dests(e.fen)}})}
function showSolution(best,wrong){
  const e=EX[exI];if(!CG)return;
  CG.set({fen:e.fen,lastMove:undefined,movable:{color:undefined,dests:new Map()}});
  const sh=[];if(best)sh.push({orig:best.slice(0,2),dest:best.slice(2,4),brush:"green"});
  if(wrong)sh.push({orig:wrong.slice(0,2),dest:wrong.slice(2,4),brush:"red"});
  CG.setAutoShapes(sh);
}

let EX=[],exI=0,exBoard=null,exSel=null,exDone=null,exFilter={ph:"all",st:"all",th:"all",sx:"all",ty:"all"};
function buildEx(){

  all.sort((a,b)=>b.l-a.l);

    const mv=hist[i],fen=b.fen(),stm=b.turn(),mine=stm===me;
    const av=mine?cur.cp:-cur.cp,best=cur.pv[0];
    const pvSan=[];{const t=new Chess(fen);for(const u of cur.pv.slice(0,6)){const m=t.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||"q"});if(!m)break;pvSan.push(m.san)}}
    let np=0;for(const r of b.board())for(const p of r)if(p&&"qrbn".includes(p.type))np++;
    const ph=i<20?"o":np<=6?"f":"m";
    b.move(mv);const nx=await ENG.evalFen(b.fen(),depth);
    const ap=(b.turn()===me)?nx.cp:-nx.cp,loss=av-ap,pu=mv.from+mv.to+(mv.promotion||"");
    if(mine&&av>-400&&best&&best.slice(0,4)!==pu.slice(0,4)&&loss>=80)
      faults.push({n:Math.floor(i/2)+1,fen,p:mv.san,pu,b:pvSan[0]||best,bu:best,pv:pvSan,pvu:cur.pv.slice(0,8),rv:nx.pv.slice(0,8),l:Math.round(loss),t:loss>=300?"g":loss>=150?"e":"i",ph,ck:clocks[i]??null,ev:Math.round(av)});
    mvl.push(pu);evl.push(Math.round(ap));bml.push(best||"");gapl.push(mine&&cur.cp2!=null?Math.round(cur.cp-cur.cp2):null);
    cur=nx;
  }
  const {pgn,...rest}=meta;return {...rest,f:faults,mv:mvl,ev:evl,bm:bml,ck:clocks.slice(0,hist.length),gap:withCrit?gapl:undefined};
}
function setStatus(msg,frac,err){
  const el=$("#status");el.hidden=!msg;if(!msg)return;
  el.innerHTML=`<div class="notice ${err?"err":""}">${msg}${frac!=null?`<div class="progress"><i style="width:${Math.round(frac*100)}%"></i></div>`:""}</div>`;
}
function blockedNotice(user,err){
  setStatus(`<div><b>Impossible de joindre Chess.com pour le moment</b>${err&&err.message?" ("+esc(err.message)+")":""}. Vérifie ta connexion et réessaie, ou importe ici un export PGN de tes parties (Chess.com → Archives → sélectionner → Télécharger).</div>
   <div class="actions"><label class="btn" for="pgnFile">Importer un fichier PGN</label><input type="file" id="pgnFile" accept=".pgn,text/plain" hidden></div>`,null,true);
  $("#pgnFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;const txt=await f.text();
    const metas=splitPGN(txt).map(p=>metaFromPGN(p,user)).filter(Boolean);
    if(!metas.length){setStatus(`Aucune partie de <b>${esc(user)}</b> dans ce fichier. Vérifie le pseudo saisi en haut.`,null,true);return}
    metas.sort((a,b)=>a.t-b.t);
    await runAnalysis(user,metas,null,"Import PGN");
  };
}
let busy=false;
async function runAnalysis(user,allMetas,rows,srcLabel){
  const cad=$("#cad").value,n=+$("#nb").value,depth=+$("#q").value;
  const pick=allMetas.filter(m=>m.tc===cad).slice(-n);
  if(!pick.length){setStatus(`Aucune partie en ${cad} trouvée pour <b>${esc(user)}</b>. Essaie une autre cadence.`,null,true);busy=false;$("#go").disabled=false;return}
  try{
    // structures de pions : les 300 dernières parties de la cadence choisie (sans moteur)
    if(window.Struct){const cl=allMetas.filter(m=>m.tc===cad).slice(-300);
      for(let i=0;i<cl.length;i++){
        if(i%20===0){setStatus(`Reconnaissance des structures de pions : ${i} parties sur ${cl.length}`,i/cl.length);await new Promise(r=>setTimeout(r,0))}
        let st=null;try{st=Struct.ofGame(fensFromPGN(cl[i].pgn,50))}catch(e){}
        cl[i].st=st?st.id:"";cl[i].ss=st?Struct.sideOf(st,cl[i].c):null;
      }}
    rows=allMetas.map(m=>[m.t,m.c,m.res,m.how,m.r,m.tc,m.op,m.st===undefined?null:m.st,m.ss===undefined?null:m.ss]);
    if(!ENG)ENG=await startEngine();
    await ELOCK;
    const withCrit=$("#crit").checked;ENG.send(`setoption name MultiPV value ${withCrit?2:1}`);
    const out=[];const t0=Date.now();
    for(let k=0;k<pick.length;k++){
      const g=await analyseGame(pick[k],depth,(i,L)=>{const done=(k+i/L)/pick.length;const el=(Date.now()-t0)/1000,rem=done>0.02?Math.round(el/done-el):null;
        setStatus(`Analyse de la partie ${k+1} sur ${pick.length} · coup ${Math.floor(i/2)+1}${rem!=null?` · environ ${rem>90?Math.round(rem/60)+" min":rem+" s"} restantes`:""}`,done)},withCrit);
      if(g)out.push(g);
    }
    S={user,at:Date.now()/1000,rows,games:out,depth:`${srcLabel} · ${ENG.name} dans le navigateur, profondeur ${depth}${withCrit?" · moments critiques":""}`};
    store.set("carnet:last",S);exI=0;
    setStatus("");renderAll();
  }catch(err){setStatus(esc(err.message||"L'analyse a échoué."),null,true);console.error(err)}
  busy=false;$("#go").disabled=false;
}
$("#ctl").onsubmit=async ev=>{
  ev.preventDefault();if(busy)return;busy=true;$("#go").disabled=true;
  const user=$("#u").value.trim();
  setStatus("Connexion à Chess.com…",null);
  let raw;
  try{raw=await fetchChesscom(user)}
  catch(err){busy=false;$("#go").disabled=false;
    if(err.status===404){setStatus(`Le pseudo <b>${esc(user)}</b> n'existe pas sur Chess.com.`,null,true);return}
    blockedNotice(user,err);return}
  const metas=raw.map(x=>metaFromJSON(x,user)).sort((a,b)=>a.t-b.t);
  await runAnalysis(user,metas,null,"Chess.com");
};
$("#cad").onchange=()=>renderBilan();
$("#p-bilan").addEventListener("click",e=>{
  const sr=e.target.closest("[data-struct]");if(sr){SELST=sr.dataset.struct;renderBilan();return}
  const gc=e.target.closest("[data-gocrit]");if(gc){exFilter={ph:"all",st:"all",th:"all",sx:"all",ty:"c"};exI=0;renderEx();tab("ex");return}
  const gd=e.target.closest("[data-godrift]");if(gd){exFilter={ph:"all",st:"all",th:"all",sx:"all",ty:"d"};exI=0;renderEx();tab("ex");return}
  const sx=e.target.closest("[data-goex]");if(sx){exFilter={ph:"all",st:"all",th:"all",sx:sx.dataset.goex,ty:"all"};exI=0;renderEx();tab("ex");return}
  const b=e.target.closest("[data-theme]");if(!b)return;exFilter={ph:"all",st:"all",th:b.dataset.theme,sx:"all",ty:"f"};exI=0;renderEx();tab("ex")});

function renderAll(){
  DCACHE.clear();OPEN=null;CRCACHE=null;
  $("#who").textContent=S.user;$("#u").value=S.user;
  $("#src").textContent=`v32 · ${S.games.length} parties analysées le ${new Date(S.at*1000).toLocaleDateString("fr-FR",{day:"numeric",month:"long"})} · ${S.depth||""}`;
  const counts={};S.rows.forEach(r=>counts[r[5]]=(counts[r[5]]||0)+1);
  const main=S.games[0]?.tc||Object.entries(counts).sort((a,b)=>b[1]-a[1])[0]?.[0]||"blitz";
  $("#cad").value=main;
  renderBilan();renderParties();renderEx();
}
renderAll();
/* écran étroit : réglages plus légers par défaut (le moteur est plus lent sur téléphone) */
{const c=store.get("carnet:crit");$("#crit").checked=c==null?!matchMedia("(max-width:600px)").matches:!!c;$("#crit").onchange=e=>store.set("carnet:crit",e.target.checked)}
if(matchMedia("(max-width:600px)").matches&&!store.get("carnet:last")){$("#nb").value="10";$("#q").value="10"}
tab(store.get("carnet:tab")||"bilan");
</script>
